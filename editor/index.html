<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%23e4572e%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-size=%2720%27 font-family=%27sans-serif%27 font-weight=%27700%27 text-anchor=%27middle%27 fill=%27white%27%3Eg%3C/text%3E%3C/svg%3E">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Editor — Geharte</title>
  <link rel="stylesheet" href="../assets/css/anim.css">
  <link rel="stylesheet" href="editor.css">
</head>
<body class="editing">
  <header id="top">
    <a class="logo" href="../" title="Voltar ao site">geh<i>arte</i></a>
    <div class="tools-nav" aria-label="Ferramentas do Geharte">
      <span class="tn on">Editor de páginas</span>
      <button class="tn" disabled title="Em breve">Máquina de escrever</button>
      <button class="tn" disabled title="Em breve">Tipografia</button>
    </div>
    <button id="btn-inventory" class="btn" title="Voltar aos documentos (o rascunho é salvo)" aria-label="Documentos"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="3" width="12" height="5" rx="1"/><rect x="6" y="10" width="12" height="5" rx="1"/><rect x="6" y="17" width="12" height="4" rx="1"/></svg><span>Documentos</span></button>
    <input id="title" aria-label="Título da página" placeholder="Título da página" maxlength="80">
    <span id="savestate"></span>
    <span class="spacer"></span>
    <div class="seg2" id="devseg">
      <button data-dev="d" title="Versão para computador"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg><span>PC</span></button>
      <button data-dev="m" title="Versão para celular"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg><span>Celular</span></button>
    </div>
    <div class="zoom">
      <button id="zout" class="btn icon" title="Diminuir zoom (Ctrl −)">−</button>
      <button id="zfit" class="btn" title="Ajustar à tela (Ctrl 0)"><span id="zval">100%</span></button>
      <button id="zin" class="btn icon" title="Aumentar zoom (Ctrl +)">+</button>
    </div>
    <button id="undo" class="btn icon" title="Desfazer (Ctrl Z)" disabled><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button id="redo" class="btn icon" title="Refazer (Ctrl Y)" disabled><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    <button id="btn-anim" class="btn" title="Pausar ou tocar as animações no editor"></button>
    <button id="btn-preview" class="btn">Visualizar</button>
    <button id="btn-savefile" class="btn primary" hidden title="Baixa o seu projeto como arquivo, no seu computador">Salvar arquivo</button>
    <button id="btn-publish" class="btn primary">Publicar</button>
    <span id="who" class="who"></span>
    <button id="btn-more" class="btn icon" title="Mais"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg></button>
  </header>

  <div id="app">
    <nav id="rail" aria-label="Ferramentas">
      <button data-tool="select" title="Selecionar (V)"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3l13 6.5-5.5 2L10 17z"/></svg></button>
      <button data-tool="text" title="Texto (T)"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg></button>
      <button data-tool="shape" title="Forma — arraste no canvas (R)"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/></svg></button>
      <button data-tool="pencil" title="Lápis (P)"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4L16 5l3 3L8 19zM14 7l3 3"/></svg></button>
      <button data-tool="image" title="Imagem…"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M21 16l-5-5-8 8"/></svg></button>
    </nav>
    <aside id="lib" aria-label="Biblioteca"></aside>
    <div id="center">
      <div id="pathbar" title="Qual página você está editando: tipo, estado (só no inventário / publicada) e arquivo. O rascunho fica salvo neste navegador."><span id="pb-kind" class="chip"></span><span id="pb-state" class="chip"></span><span id="pb-path"></span><i>·</i><span id="pb-name"></span><span id="pb-dev"></span></div>
      <main id="viewport">
        <div id="stage"><div id="holder"></div><div id="overlay"></div></div>
      </main>
    </div>
    <aside id="props" aria-label="Propriedades"></aside>
  </div>
  <script type="module" src="../assets/js/editor/main.js"></script>
</body>
</html>
